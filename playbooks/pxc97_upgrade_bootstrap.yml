---
# This playbook upgrades the PXC 8.4 bootstrap node to PXC 9.7

- hosts: all
  become: true
  become_method: sudo
  environment:
    PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"

  tasks:

  - name: disable old repos
    command: percona-release disable all

  - name: update deb cache
    command: apt update
    when:
      - ansible_os_family == "Debian"

  - name: Clean and update package cache
    shell: |
      {{ ansible_pkg_mgr }} clean all
      {{ ansible_pkg_mgr }} makecache
    when:
      - ansible_facts['distribution'] in ["RedHat", "CentOS", "OracleLinux", "Amazon"]

  - name: include tasks for enabling test repo pxc97
    include_tasks: ../tasks/enable_pxc97_testing_repo.yml
    when:
    - lookup('env', 'install_repo') == "testing"

  - name: include tasks for enabling main repo pxc97
    include_tasks: ../tasks/enable_pxc97_main_repo.yml
    when:
    - lookup('env', 'install_repo') == "main" or lookup('env', 'install_repo') == ""

  - name: include tasks for enabling experimental repo pxc97
    include_tasks: ../tasks/enable_pxc97_experimental_repo.yml
    when:
    - lookup('env', 'install_repo') == "experimental"

  - name: stop bootstrapped PXC 8.4 node before major upgrade
    command: systemctl stop mysql@bootstrap.service

  # keep deb postinst from starting mysql mid-upgrade; it is started explicitly below
  - name: prevent deb package scripts from starting mysql during upgrade
    copy:
      dest: /usr/sbin/policy-rc.d
      content: "#!/bin/sh\nexit 101\n"
      mode: '0755'
    when:
      - ansible_os_family == "Debian"

  - name: upgrade PXC to 9.7 deb packages
    apt:
      name: "{{ packages }}"
      update_cache: yes
      state: latest
    vars:
      packages:
      - percona-xtradb-cluster-full
    when:
      - ansible_os_family == "Debian"
    environment:
      PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"
      PERCONA_TELEMETRY_DISABLE: "1"

  - name: allow deb package scripts to start services again
    file:
      path: /usr/sbin/policy-rc.d
      state: absent
    when:
      - ansible_os_family == "Debian"

  - name: upgrade PXC to 9.7 rpm packages
    yum:
      name: "{{ packages }}"
      state: latest
    vars:
      packages:
      - percona-xtradb-cluster-full
    when:
      - ansible_os_family == "RedHat"
    environment:
      PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"
      PERCONA_TELEMETRY_DISABLE: "1"

  # the common nodes joined this node and are still running on 8.4, so it must rejoin
  # their cluster as a regular node; bootstrapping again would split the cluster
  - name: rejoin upgraded PXC 9.7 node to the running cluster
    block:
      - name: start mysql
        service: name=mysql state=restarted
    rescue:
      - name: collect bootstrap failure diagnostics
        shell: |
          echo "=== systemctl status ==="; systemctl status mysql.service --no-pager -l
          echo "=== journalctl ==="; journalctl -xeu mysql.service --no-pager | tail -n 60
          echo "=== error log ==="; tail -n 80 /var/log/mysqld.log /var/log/mysql/error.log 2>/dev/null
          echo "=== grastate.dat ==="; cat /var/lib/mysql/grastate.dat
        register: bootstrap_diag
        failed_when: false

      - name: print bootstrap failure diagnostics
        debug: var=bootstrap_diag.stdout_lines

      - name: fail after printing diagnostics
        fail:
          msg: "mysql failed to rejoin the cluster after upgrade to PXC 9.7, see diagnostics above"

  - name: Sleep for 60 seconds
    shell: sleep 60

  - name: register PXC version Side Effect
    shell: mysqld --version
    register: pxc_version

  - name: print PXC version Side Effect
    debug: var=pxc_version

  - name: Verify telemetry version and package installation
    command: /package-testing/check_tel_ver_pack.sh
    when:
      - ansible_distribution != "Amazon"
      - ansible_distribution_major_version|int != 7

  - name: PRINT THE INSTALLED PACKAGES VALUE UPGRADE
    include_tasks: ../tasks/list_installed_packages.yml

  - name: check PXC 9.7 version Molecule
    command: /package-testing/version_check.sh pxc97

  - name: check that PXC 9.7 package versions are correct
    command: /package-testing/package_check.sh pxc97
